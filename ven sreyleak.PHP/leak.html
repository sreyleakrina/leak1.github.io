<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    
	<div class="container py-5">
		<div class="row">
			<div class="col-6">
				<h1 class="text-primary">facebook</h1>
				<p>connect with friends and the word around you on Facebook</p>
			</div>		
			<div class="col-6">

				<div class="card">
					<div class="card-body">
						<div class="text-center">
							<div>
								<input type="email" class="form-control" placeholder="Email or phone numbber">
							</div>
							<div class="mt-2 ">
								<input type="password" class="form-control" placeholder="password">
							</div>
							<div>
								<button class="mt-2 form-control bg-primary">Login</button>
							</div>
							<div>
								<a class="mt-2  text-decoration-none">Forgot Password?</a>
							</div>
							<hr>
							<div>
								<button class="btn  btn-warning">Create new account</button>
							</div>
						</div>
					</div>
				</div>

			</div>
		</div>
		
	</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
